name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and VERSION differ.' }
      - name: Build
        run: ./scripts/Build.ps1
      - name: Test
        run: ./scripts/Test.ps1
      - name: Package
        run: ./scripts/Package.ps1
      - name: Get verified installer compiler
        run: ./scripts/Get-InstallerCompiler.ps1
      - name: Build Windows installer
        run: ./scripts/Build-Installer.ps1
      - name: Verify installation and removal
        run: ./scripts/Test-Installer.ps1
      - name: Publish tagged application
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = Get-ChildItem artifacts/ClearFrame-*.zip,artifacts/ClearFrame-*.exe,artifacts/ClearFrame-*.sha256 | ForEach-Object FullName
          $notes = @"
          Download **ClearFrame-Setup.exe** below for Windows 10/11 x64.

          Open the setup file and click Install. Setup downloads and verifies the required video tools automatically. Keep your internet connection on. Then open ClearFrame from the Start menu. No terminal commands or administrator account are needed.

          New in v0.9.0: save your vertical clip projects and reopen them later. Choose More > Create a vertical clip, add your named clips, then Save project. Open project restores names, order, ranges, crop positions and output sizes.

          Projects verify the original source and let you locate it if renamed or moved. Keep that source video: projects contain settings, not media. Saves are manual and retain a previous-version backup. Reopened clips start Ready; they never export automatically, and existing output files remain protected. Save clip / Save changes before saving the project to include editor changes.

          Batches of up to 50 clips, sequential verified exports, cancellation and retry remain available. Crops stay fixed through each clip; resizing cannot add detail. SDR square-pixel sources only.

          Windows playback conversion, audio-language selection, scheduled downloads and video cleanup remain available. Close the app before updating. Your download history and saved media are kept.

          Advanced users can choose the portable ZIP and run Get-Tools.ps1 in PowerShell 7 instead.

          Requires .NET Framework 4.7.2+. This build is unsigned, so Windows may show an unknown-publisher warning. Download only from this repository. Automated installation checks pass; full manual interaction and live YouTube clip/alternate-language downloads remain unverified.
          See CHANGELOG.md and the user guide in the repository for features and known limitations.
          "@
          $notes | Set-Content artifacts/release-notes.md
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "ClearFrame $env:RELEASE_TAG" --notes-file artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
