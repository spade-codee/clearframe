name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        run: ./scripts/Build.ps1
      - name: Offline checks and renders
        run: ./scripts/Test.ps1
      - name: Package application only
        run: ./scripts/Package.ps1
      - name: Get verified installer compiler
        run: ./scripts/Get-InstallerCompiler.ps1
      - name: Build Windows installer
        run: ./scripts/Build-Installer.ps1
      - name: Install, reinstall, run tools and uninstall
        run: ./scripts/Test-Installer.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-checks
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
